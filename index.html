<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ჩემს პრინცესას</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fdfbfb 0%, #f3e6e8 100%);
            font-family: 'Noto Sans Georgian', sans-serif;
            overflow: hidden; /* აცილებს სქროლს */
            touch-action: manipulation;
        }

        #app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            max-width: 430px; /* iPhone 16 Pro width approximate */
            margin: 0 auto;
            background: linear-gradient(135deg, #fff0f0 0%, #fdeff2 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* 1. მორბენალი ცხვარი ყვავილით */
        #intro-sheep {
            position: absolute;
            font-size: 55px;
            top: 15%;
            right: -100px;
            z-index: 10;
            transform: scaleX(-1); /* იყურება მარცხნივ */
        }

        /* 2. გულების წვიმა */
        .heart {
            position: absolute;
            top: -30px;
            font-size: 24px;
            z-index: 1;
            opacity: 0.7;
        }

        /* 3. ცენტრალური ცხვარი */
        #center-sheep {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 90px;
            z-index: 5;
            cursor: pointer;
            text-align: center;
            opacity: 0;
            pointer-events: none; /* სანამ არ გამოჩნდება სრულად */
        }
        .click-hint {
            font-size: 14px;
            color: #d49a9a;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        /* 4. კონვერტები */
        #envelopes-container {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            z-index: 6;
            flex-direction: column;
            gap: 20px;
        }

        .envelope {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            color: #b56c78;
            box-shadow: 0 10px 25px rgba(220, 180, 185, 0.4);
            border: 2px solid #ffe8e8;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .envelope:active {
            transform: scale(0.95);
        }
        .envelope span {
            font-size: 30px;
            display: block;
            margin-bottom: 5px;
        }

        /* 5. წერილის გვერდი (Modal) */
        #letter-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fffcfc 0%, #fcf0f2 100%);
            z-index: 20;
            display: none; /* იმალება საწყისად */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
        }

        .letter-content {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(200, 150, 155, 0.2);
            text-align: center;
            line-height: 1.6;
            color: #6a4b50;
            font-size: 16px;
            border-top: 5px solid #f2a6b0;
            max-height: 70vh;
            overflow-y: auto;
        }

        .close-btn {
            margin-top: 25px;
            background: #f2a6b0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(242, 166, 176, 0.4);
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 1. პირველი ანიმაცია -->
    <div id="intro-sheep">🌹🐑</div>

    <!-- 2. ცენტრალური ცხვარი -->
    <div id="center-sheep">
        <div>🥺🐑</div>
        <div class="click-hint">შემეხე...</div>
    </div>

    <!-- 3. კონვერტები -->
    <div id="envelopes-container">
        <div class="envelope" onclick="openLetter(1)">
            <span>💌</span> წერილი 1
        </div>
        <div class="envelope" onclick="openLetter(2)">
            <span>💌</span> წერილი 2
        </div>
        <div class="envelope" onclick="openLetter(3)">
            <span>💌</span> წერილი 3
        </div>
    </div>

    <!-- 4. ღია წერილის სივრცე -->
    <div id="letter-modal">
        <div class="letter-content" id="letter-text"></div>
        <button class="close-btn" onclick="closeLetter()">უკან დაბრუნება 🤍</button>
    </div>
</div>

<script>
    // შენი ტექსტები
    const letters = {
        1: "ბოდიში ჩემო პატარა პრინცესა 🥺😓<br><br>ჩემო ჩემო ბედნიერებავ 🫂😓 მაპატიე რომ გული გატკინე და გაწყენინე 😓 არ იმსახურებ ჩემსგან ამდენ გულის ტკენას 😓🥺 ვწუხვარ და ვნანობ უზომოდ ჩემს საქციელებს, ყოველ იმ გულის ტკივილს, წყენას და იმედგაცრუებას რაც მოგაყენე და გაგრძნობინე 😓🫂 მაპატიე ჩემო პრინცესა.",
        2: "ჩემო ჩემო ჩემო ბედნიერებააავ 💚🥰<br><br>ჩემო ერთადერთო 🫂💚 ჩემო ღვთაებავ 💚🥰 ჩემი ცხოვრების არსოოო 🥰✨ ჩემო ძალავ 💚🥰 ჩემო ცხოვრების არსო 🥰💚 ჩემი გულის დედოფალი ხარ 🥰💚 ჩემი პატარა ანგელოზი ხარ 💚🫂 უსაყვარლესი მყავხარ 💚🥰 უსა უსა უსაყვარლესიიიი 💚✨ საუკეთესო ხარ პატარავ 🫂🥰 შენთან ახლოს ვერავინ ვერ დგას უზომოდ მიყვარხაააარ 💚💚💚",
        3: "მინდა იცოდე რომ ჩემი მთელი არსება ხარ...<br><br>შენით ვცოცხლობ და ვარსებობ 💚 ერთადერთი ხარ 💚✨ ვისაც მინდა ჩემი თავი შევსწირო, ვისაც მინდა მივუძღვნა ჩემი თითოეული წამი 💚🫂 ვის გვერდითაც მინდა გავატარო მთელი დარჩენილი ცხოვრება ✨💚 უბედნიერესი მინდა იყო ჩემს გვერდით 🫂💚<br><br>მინდა წამითაც არ ნანობდე იმას, რომ ამდენ ადამიანში მაინცდამაინც მე ამირჩიე და მე მომეცი შანსი ვყოფილიყავი უბედნიერესი 💚🥰 მადლობა ყველაფრისთვის რასაც ჩემთვის აკეთებ 💚✨ ნამდვილი ქალღმერთი მყავხარ 💚🫂 იმედია ჩვენი შვილებიც შენ დაგემსგავსებიან 💚🥰<br><br>ცუდია რომ ვერ გადმოვცემ ბოლომდე თუ რა ძლიერ მიყვარხარ ✨💚 როგორი მნიშვნელოვანი ხარ ჩემთვის 💚🫂 გყვარობ მთელი ჩემი არსით 💚💚💚"
    };

    const container = document.getElementById('app-container');
    const introSheep = document.getElementById('intro-sheep');
    const centerSheep = document.getElementById('center-sheep');
    const envelopesContainer = document.getElementById('envelopes-container');
    const letterModal = document.getElementById('letter-modal');
    const letterText = document.getElementById('letter-text');

    // ეტაპი 1: მორბენალი ცხვარი
    window.onload = () => {
        gsap.to(introSheep, {
            x: -window.innerWidth - 100, 
            duration: 4.5, 
            ease: "power1.inOut",
            onComplete: () => {
                introSheep.style.display = "none";
                startHeartRain();
                showCenterSheep();
            }
        });
    };

    // გულების წვიმის ფუნქცია
    function startHeartRain() {
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            // ვიყენებთ წითელ და მწვანე გულებს ტექსტის შესაბამისად
            const heartEmojis = ['🤍', '🌸', '💖', '💚', '✨'];
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            container.appendChild(heart);

            gsap.to(heart, {
                y: window.innerHeight + 50,
                x: "+=" + (Math.random() * 100 - 50), // ოდნავ რხევა
                rotation: Math.random() * 360,
                duration: Math.random() * 3 + 3,
                ease: "none",
                onComplete: () => {
                    heart.remove();
                }
            });
        }, 400); // ახალი გული ყოველ 400 მილიწამში
    }

    // მოწყენილი ცხვრის გამოჩენა
    function showCenterSheep() {
        gsap.to(centerSheep, { opacity: 1, duration: 1.5, pointerEvents: "auto" });
        
        // სუნთქვის ანიმაცია GSAP-ით
        gsap.to(centerSheep, { 
            y: "-=10", 
            duration: 1.5, 
            yoyo: true, 
            repeat: -1, 
            ease: "sine.inOut" 
        });
    }

    // ეტაპი 2: მოწყენილ ცხვარზე დაჭერა
    centerSheep.addEventListener('click', () => {
        // ცხვარი დგება და იღებს წერილს
        centerSheep.innerHTML = "<div>🏃‍♂️🐑💌</div>";
        
        // მორბის ეკრანისკენ (დიდდება) და ქრება
        gsap.to(centerSheep, {
            scale: 6,
            opacity: 0,
            duration: 1.5,
            ease: "power2.in",
            onComplete: () => {
                centerSheep.style.display = "none";
                showEnvelopes();
            }
        });
    });

    // ეტაპი 3: კონვერტების გამოჩენა
    function showEnvelopes() {
        envelopesContainer.style.display = "flex";
        gsap.from(".envelope", {
            y: 100,
            opacity: 0,
            duration: 0.8,
            stagger: 0.2,
            ease: "back.out(1.5)"
        });
    }

    // წერილის გახსნა
    function openLetter(id) {
        letterText.innerHTML = letters[id];
        letterModal.style.display = "flex";
        
        gsap.to(letterModal, {
            opacity: 1,
            duration: 0.4,
            ease: "power1.inOut"
        });
        
        gsap.from(".letter-content", {
            scale: 0.8,
            opacity: 0,
            y: 50,
            duration: 0.5,
            delay: 0.1,
            ease: "back.out(1.2)"
        });
    }

    // წერილის დახურვა
    function closeLetter() {
        gsap.to(letterModal, {
            opacity: 0,
            duration: 0.4,
            onComplete: () => {
                letterModal.style.display = "none";
            }
        });
    }
</script>
</body>
</html>
